[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexml-nonstat"
version = "0.1.0"
description = "LexML parser for Brazilian non-statutory legal documents"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    # Cycle 1's reader uses docx.styles.BabelFish to map Word's internal style
    # names ("heading 1") onto the UI names everything else uses ("Heading 1").
    # Verified against 1.2.0; the floor tracks the API we actually touch.
    "python-docx>=1.1",
]

# The unified CLI (Cycle 8). The module form
# `PYTHONPATH=src python3 -m lexml_nonstat` reaches the same entry point and is
# what the suite uses, because the package is deliberately not installed.
[project.scripts]
lexml-nonstat = "lexml_nonstat.cli:main"

[project.optional-dependencies]
# The referee is consulted over an OpenAI-compatible HTTP API (plan §7.2).
# Never required by the regression suite, which pins --referee=none.
referee = ["httpx>=0.27"]
# Saxon drives the reference XSLT stylesheets (plan §6.2). Optional: the
# Python segmentation API is the primary path, XSLT tests skip without it.
xslt = ["saxonche>=12"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexml_nonstat = ["validate/stubs/*.xsd", "segments/stylesheets/*.xsl"]

# Cycle 9's coverage gate (amendment A-9.2). The plan asks for "≥85% on
# hierarchy/, routing/, render/"; `make coverage` applies the floor.
#
# The per-package `__main__.py` debug views are omitted from the denominator.
# They are developer entry points superseded by Cycle 8's unified CLI — one of
# them, `routing/__main__.py`, the suite never imports at all — and their
# behaviour is covered through the library by the CLI's own tests. The omission
# lives here, in the open, rather than inside a recipe: a gate that can be
# weakened invisibly is not a gate, which is the same reasoning §9.4 applies to
# goldens.
[tool.coverage.run]
source = ["lexml_nonstat"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real network service; excluded by default (plan §9.3)",
    "slow: long-running",
]
addopts = "-m 'not live'"
